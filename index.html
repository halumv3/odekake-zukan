<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>おでかけずかん</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ログイン画面 -->
<div id="loginScreen" class="oz-login-screen">
  <div class="oz-login-card">
    <h1>おでかけずかん</h1>
    <p>ログインして続ける</p>
    <input type="email" id="loginEmail" placeholder="メールアドレス" autocomplete="username" />
    <input type="password" id="loginPassword" placeholder="パスワード" autocomplete="current-password" />
    <button type="button" id="loginBtn" class="oz-btn oz-btn-primary">ログイン</button>
    <p id="loginError" class="oz-error" hidden></p>
  </div>
</div>

<div id="appRoot" hidden>

<div class="oz-app">

  <header class="oz-header">
    <div>
      <h1>おでかけずかん</h1>
      <p>家族のお気に入りスポット手帳</p>
    </div>
    <div class="oz-header-actions">
      <button type="button" class="oz-btn oz-btn-ghost oz-home-btn" id="homeSettingsBtn" title="自宅住所の設定（この端末だけに保存されます）">🏠</button>
      <button type="button" class="oz-btn oz-btn-ghost oz-home-btn" id="logoutBtn" title="ログアウト">🚪</button>
      <button type="button" class="oz-btn oz-btn-primary oz-add-btn" id="openAddBtn">
        ＋ 追加する
      </button>
    </div>
  </header>

  <div class="oz-filters">
    <div class="oz-search">
      🔍
      <input type="text" id="searchInput" placeholder="名前や場所でさがす" />
    </div>

    <div class="oz-chip-row" id="statusFilterRow">
      <button type="button" class="oz-chip is-active" data-status-filter="all">すべて</button>
      <button type="button" class="oz-chip" data-status-filter="visited">✅ 行った</button>
      <button type="button" class="oz-chip" data-status-filter="wishlist">📌 行きたい</button>
    </div>

    <div class="oz-chip-row" id="typeFilterRow">
      <button type="button" class="oz-chip is-active" data-type-filter="all">すべて</button>
      <button type="button" class="oz-chip" data-type-filter="pool">🏊 プール</button>
      <button type="button" class="oz-chip" data-type-filter="park">🌳 公園</button>
      <button type="button" class="oz-chip" data-type-filter="other">📍 その他</button>
    </div>

    <div class="oz-chip-row" id="weatherFilterRow">
      <button type="button" class="oz-chip" data-weather-filter="sunny">☀️ 晴れの日</button>
      <button type="button" class="oz-chip" data-weather-filter="rainy">☔ 雨の日</button>
      <button type="button" class="oz-chip" data-weather-filter="cold">❄️ 寒い日</button>
      <button type="button" class="oz-chip" data-weather-filter="hot">🔥 暑い日</button>
    </div>
  </div>

  <div id="statusMsg" class="oz-save-error" hidden></div>

  <main class="oz-main">
    <div id="loadingMsg" class="oz-empty">読み込み中…</div>
    <div id="emptyMsg" class="oz-empty" hidden></div>
    <div id="grid" class="oz-grid"></div>
  </main>

</div>

<!-- 追加・編集フォーム -->
<div id="overlay" class="oz-overlay" hidden>
  <div class="oz-sheet">

    <div class="oz-sheet-header">
      <button type="button" class="oz-icon-btn" id="closeBtnLeft">←</button>
      <h2 id="formTitle">おでかけを追加</h2>
      <button type="button" class="oz-icon-btn" id="closeBtnRight">✕</button>
    </div>

    <div class="oz-sheet-body">

      <section class="oz-field">
        <label>名前</label>
        <input type="text" id="f-name" placeholder="例）〇〇市民プール" />
        <p class="oz-error" id="nameError" hidden>名前を入力してください</p>
      </section>

      <section class="oz-field">
        <label>ステータス</label>
        <div class="oz-segmented" id="statusSegment">
          <button type="button" class="oz-seg-btn seg-neutral" data-status-option="visited">✅ 行った</button>
          <button type="button" class="oz-seg-btn seg-neutral" data-status-option="wishlist">📌 行きたい</button>
        </div>
      </section>

      <section class="oz-field">
        <label>種類</label>
        <div class="oz-segmented" id="typeSegment">
          <button type="button" class="oz-seg-btn seg-pool" data-type-option="pool">🏊 プール</button>
          <button type="button" class="oz-seg-btn seg-park" data-type-option="park">🌳 公園</button>
          <button type="button" class="oz-seg-btn seg-other" data-type-option="other">📍 その他</button>
        </div>
      </section>

      <section class="oz-field" id="customTypeSection">
        <label>その他の種類（例：お店、水族館など）</label>
        <input type="text" id="f-customType" placeholder="例）お店" />
      </section>

      <section class="oz-field">
        <label>住所・目印になる場所</label>
        <input type="text" id="f-address" placeholder="道順の検索に使います" />
      </section>

      <section class="oz-field">
        <label>行くのにおすすめの天気</label>
        <div class="oz-chip-row" id="weatherFormRow">
          <button type="button" class="oz-chip" data-weather-option="sunny">☀️ 晴れの日</button>
          <button type="button" class="oz-chip" data-weather-option="rainy">☔ 雨の日</button>
          <button type="button" class="oz-chip" data-weather-option="cold">❄️ 寒い日</button>
          <button type="button" class="oz-chip" data-weather-option="hot">🔥 暑い日</button>
        </div>
      </section>

      <div class="oz-divider">訪問記録</div>
      <section class="oz-field">
        <div id="visitList" class="oz-visit-list"></div>
        <div class="oz-visit-add">
          <input type="date" id="v-date" />
          <select id="v-weather">
            <option value="sunny">☀️ 晴れ</option>
            <option value="cloudy">☁️ 曇り</option>
            <option value="rainy">☔ 雨</option>
            <option value="snowy">❄️ 雪</option>
          </select>
          <input type="text" id="v-note" placeholder="その日のメモ（任意）" />
          <button type="button" class="oz-btn oz-btn-ghost" id="addVisitBtn">＋ 追加</button>
        </div>
      </section>

      <section class="oz-field">
        <label>写真（数枚まで・自動で圧縮されます）</label>
        <div class="oz-photo-row" id="photoRow"></div>
        <input type="file" id="f-photoInput" accept="image/*" multiple />
      </section>

      <section class="oz-field">
        <a href="#" id="f-mapsHelper" class="oz-btn oz-btn-ghost" target="_blank" rel="noopener noreferrer">
          🧭 Googleマップで経路を確認する
        </a>
        <p class="oz-hint">別タブで開いた地図を見ながら、下の欄に入力すると楽です</p>
      </section>

      <section class="oz-field">
        <label>移動手段</label>
        <div class="oz-segmented" id="transportSegment">
          <button type="button" class="oz-seg-btn seg-neutral" data-transport-option="car">🚗 車</button>
          <button type="button" class="oz-seg-btn seg-neutral" data-transport-option="bus">🚌 バス・電車</button>
          <button type="button" class="oz-seg-btn seg-neutral" data-transport-option="walk">🚶 徒歩</button>
        </div>
      </section>

      <section class="oz-field-grid">
        <div class="oz-field">
          <label>📏 距離（km）</label>
          <input type="number" inputmode="decimal" id="f-distance" />
        </div>
        <div class="oz-field">
          <label>⏱ 移動時間（分）</label>
          <input type="number" inputmode="numeric" id="f-time" />
        </div>
        <div class="oz-field">
          <label>💴 高速代（円）</label>
          <input type="number" inputmode="numeric" id="f-toll" />
        </div>
      </section>

      <section class="oz-field">
        <label>総合評価</label>
        <div class="oz-stars stars-lg" id="f-overallStars"></div>
      </section>

      <section class="oz-field">
        <label>総合評価コメント</label>
        <textarea id="f-overallReview" rows="3" placeholder="よかった点・気になった点など、一覧画面の★から見られます"></textarea>
      </section>

      <div id="poolSection">
        <div class="oz-divider">プールの評価</div>

        <section class="oz-field">
          <label>更衣室の清潔さ</label>
          <div class="oz-stars stars-md" id="f-changingRoomStars"></div>
        </section>

        <section class="oz-field">
          <label>プールの特徴</label>
          <div class="oz-chip-row" id="featureRow">
            <button type="button" class="oz-chip" data-feature="ウォータースライダー">ウォータースライダー</button>
            <button type="button" class="oz-chip" data-feature="流れるプール">流れるプール</button>
            <button type="button" class="oz-chip" data-feature="幼児用プール">幼児用プール</button>
            <button type="button" class="oz-chip" data-feature="屋内プール">屋内プール</button>
            <button type="button" class="oz-chip" data-feature="飛び込み台">飛び込み台</button>
            <button type="button" class="oz-chip" data-feature="歩行浴コース">歩行浴コース</button>
          </div>
        </section>

        <section class="oz-field">
          <label class="oz-checkbox-label">
            <input type="checkbox" id="f-reservation" />
            📅 予約が必要
          </label>
        </section>

        <section class="oz-field">
          <label>利用時間・時間制限</label>
          <input type="text" id="f-timeLimit" placeholder="例）2時間入替制" />
        </section>
      </div>

      <section class="oz-field">
        <label>💴 料金</label>
        <input type="text" id="f-price" placeholder="例）大人500円・子ども200円" />
      </section>

      <div class="oz-divider">駐車場</div>
      <section class="oz-field-grid oz-field-grid-2">
        <div class="oz-field">
          <label>🚗 台数・広さ</label>
          <input type="text" id="f-parkingCapacity" placeholder="例）50台・広め" />
        </div>
        <div class="oz-field">
          <label>停めやすさ</label>
          <div class="oz-stars stars-md" id="f-parkingEaseStars"></div>
        </div>
      </section>

      <section class="oz-field">
        <label>メモ</label>
        <textarea id="f-notes" rows="3" placeholder="持ち物、混雑時間帯、子どもの反応など"></textarea>
      </section>

    </div>

    <div class="oz-sheet-footer">
      <button type="button" class="oz-btn oz-btn-danger" id="deleteBtn" hidden>🗑 削除</button>
      <button type="button" class="oz-btn oz-btn-ghost" id="cancelBtn">キャンセル</button>
      <button type="button" class="oz-btn oz-btn-primary" id="saveBtn">保存する</button>
    </div>

  </div>
</div>

<!-- 自宅住所の設定（この端末のみに保存・データベースには送信しません） -->
<div id="homeOverlay" class="oz-overlay" hidden>
  <div class="oz-sheet oz-sheet-small">
    <div class="oz-sheet-header">
      <span></span>
      <h2>🏠 自宅住所の設定</h2>
      <button type="button" class="oz-icon-btn" id="homeCloseBtn">✕</button>
    </div>
    <div class="oz-sheet-body">
      <p class="oz-hint">この端末のブラウザだけに保存されます。データベースには送信されないので、他の人には共有されません。</p>
      <section class="oz-field">
        <label>自宅の住所</label>
        <input type="text" id="homeAddressInput" placeholder="例）東京都〇〇区〇〇1-2-3" />
      </section>
    </div>
    <div class="oz-sheet-footer">
      <button type="button" class="oz-btn oz-btn-ghost" id="homeClearBtn">削除</button>
      <button type="button" class="oz-btn oz-btn-primary" id="homeSaveBtn">保存する</button>
    </div>
  </div>
</div>

</div><!-- /appRoot -->

<!-- Firebase SDK (compat版・ビルド不要) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="app.js"></script>

</body>
</html>
